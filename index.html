<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button><img src="weather-app-img/images/search.png" alt="" srcset=""></button>
        </div>
        <div class="error">
            <p>Invalid City name</p>
        </div>
        <div class="weather">
            <img src="weather-app-img/images/rain.png" class="weather-icon">
            <h1 class="temp">27°c</h1>
            <h2 class="city">Bangalore</h2>
                <div class="details">
                    <div class="col">
                        <img src="weather-app-img/images/humidity.png" alt="">
                         <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                         </div>
                    </div>
                     <div class="col">
                        <img src="weather-app-img/images/wind.png" alt="">
                         <div>
                            <p class="wind">15 km/h</p>
                            <p>Wind Speed</p>
                         </div>
                    </div>
                </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
   

</html>
